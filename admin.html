<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hamro Message • Admin Control Center</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:#17202a}
.wrap{max-width:1100px;margin:auto;padding:18px}.top{background:#fff;border-radius:22px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 18px #00000012}
.brand{display:flex;align-items:center;gap:12px}.shield{font-size:34px}.title{font-size:24px;font-weight:800}.email{color:#667085;margin-top:3px}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.logout{background:#17202a;color:#fff}.refresh{background:#1877f2;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat{background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 18px #0000000c}.stat small{color:#667085;font-size:16px}.stat b{display:block;font-size:34px;margin-top:8px}
.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 4px 18px #0000000c;margin-bottom:18px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.head h2{margin:0}.search{width:100%;padding:13px 15px;border:1px solid #d0d5dd;border-radius:13px;font-size:16px;margin-bottom:14px}
.user{display:grid;grid-template-columns:minmax(230px,1fr) 110px minmax(250px,auto);align-items:center;gap:14px;padding:14px 4px;border-top:1px solid #eaecf0}
.person{display:flex;align-items:center;gap:12px;min-width:0}.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#e5e7eb}.name{font-weight:800}.sub{font-size:13px;color:#667085;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{display:inline-block;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800}.online{background:#dcfce7;color:#166534}.offline{background:#f2f4f7;color:#667085}.blocked{background:#fee2e2;color:#b42318}.deleted{background:#111827;color:#fff}.actions{display:flex;flex-wrap:wrap;gap:7px}.open{background:#e8f1ff;color:#175cd3}.block{background:#fee4e2;color:#b42318}.unblock{background:#dcfae6;color:#087443}.delete{background:#111827;color:#fff}
.login{max-width:460px;margin:8vh auto;background:#fff;border-radius:26px;padding:30px;box-shadow:0 10px 40px #0002;text-align:center}.login h1{margin:0 0 8px}.login p{color:#667085}.login button{width:100%;background:#1877f2;color:#fff;font-size:16px}.err{color:#c62828;margin-top:12px}
.loading{text-align:center;padding:30px;color:#667085}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#17202a;color:#fff;padding:13px 18px;border-radius:12px;display:none;z-index:20}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.user{grid-template-columns:1fr}.actions{justify-content:flex-start}.wrap{padding:10px}.top{align-items:flex-start}.title{font-size:20px}}
@media(max-width:480px){.grid{gap:9px}.stat{padding:15px}.stat b{font-size:28px}.top{border-radius:17px}.logout{padding:10px}.user{padding:15px 0}}
</style>
</head>
<body>
<div id="login" class="login">
  <div style="font-size:42px">🛡️</div>
  <h1>Hamro Message Admin</h1>
  <p>Admin access only</p>
  <button id="googleBtn">Continue with Google</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="app" style="display:none">
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="shield">🛡️</div>
      <div><div class="title">Hamro Message Admin</div><div class="email" id="adminEmail"></div></div>
    </div>
    <div style="display:flex;gap:8px"><button class="refresh" onclick="loadAll()">Refresh</button><button class="logout" onclick="logout()">Logout</button></div>
  </div>

  <div class="grid">
    <div class="stat"><small>Total Users</small><b id="total">0</b></div>
    <div class="stat"><small>Online</small><b id="online">0</b></div>
    <div class="stat"><small>Blocked</small><b id="blocked">0</b></div>
    <div class="stat"><small>Groups</small><b id="groups">0</b></div>
  </div>

  <div class="card">
    <div class="head"><h2>Users</h2><span id="statusText" style="color:#667085">Loading…</span></div>
    <input id="search" class="search" placeholder="Search name, email, phone or user ID…" oninput="renderUsers()">
    <div id="users"><div class="loading">Loading users…</div></div>
  </div>
</div>
</div>
<div id="toast" class="toast"></div>

<script>
const ADMIN_EMAIL="joshibasu123456@gmail.com";
const firebaseConfig={
 apiKey:"AIzaSyD-ZwsV9vfkRvJQVGnezrIUsB0nZZXrSGo",
 authDomain:"hamro-message-4622c.firebaseapp.com",
 databaseURL:"https://hamro-message-4622c-default-rtdb.firebaseio.com",
 projectId:"hamro-message-4622c",
 storageBucket:"hamro-message-4622c.firebasestorage.app",
 messagingSenderId:"614672953381",
 appId:"1:614672953381:web:bc057d676bbbc07d64cfcc",
 measurementId:"G-GGB5PK89MY"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database();
let allUsers=[],blockedMap={},deletedMap={};

function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";clearTimeout(window.__t);window.__t=setTimeout(()=>x.style.display="none",2200)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function photo(u){return u.photo||u.profilePhoto||"https://via.placeholder.com/100?text=User"}

document.getElementById("googleBtn").onclick=async()=>{
  try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
  catch(e){document.getElementById("loginErr").textContent=e.message||"Login failed"}
};

auth.onAuthStateChanged(async user=>{
  if(!user){document.getElementById("login").style.display="block";document.getElementById("app").style.display="none";return}
  if((user.email||"").trim()!==ADMIN_EMAIL){
    document.getElementById("loginErr").textContent="This Gmail is not authorized as Admin.";
    await auth.signOut(); return;
  }
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("adminEmail").textContent=user.email;
  loadAll();
  if(window.__hmAdminListeners){window.__hmAdminListeners.forEach(x=>{try{x.off()}catch(e){}})}
  window.__hmAdminListeners=[db.ref("users"),db.ref("blockedAuth"),db.ref("deletedAuth")];
  window.__hmAdminListeners.forEach(r=>r.on("value",()=>{clearTimeout(window.__hmAdminRefresh);window.__hmAdminRefresh=setTimeout(loadAll,250)}));
});

async function loadAll(){
  document.getElementById("statusText").textContent="Loading…";
  try{
    const us=await db.ref("users").once("value");
    allUsers=[];
    us.forEach(c=>{allUsers.push({id:c.key,...(c.val()||{})})});
    const [bs,ds,gs]=await Promise.all([
      db.ref("blockedAuth").once("value").catch(()=>null),
      db.ref("deletedAuth").once("value").catch(()=>null),
      db.ref("groupChats").once("value").catch(()=>null)
    ]);
    blockedMap={}; deletedMap={};
    if(bs)bs.forEach(c=>{if(c.val()===true)blockedMap[c.key]=true});
    if(ds)ds.forEach(c=>{if(c.val()===true)deletedMap[c.key]=true});
    document.getElementById("total").textContent=allUsers.length;
    document.getElementById("online").textContent=allUsers.filter(u=>u.online===true||u.online==="true").length;
    document.getElementById("blocked").textContent=Object.keys(blockedMap).length;
    let gc=0;if(gs)gs.forEach(()=>gc++);
    document.getElementById("groups").textContent=gc;
    renderUsers();
    document.getElementById("statusText").textContent=allUsers.length+" users loaded";
  }catch(e){
    console.error(e);
    document.getElementById("statusText").textContent="Database read failed";
    document.getElementById("users").innerHTML='<div class="loading">Users load nahi hue. Firebase Rules me /users ka .read admin ke liye allowed hona chahiye.<br><small>'+esc(e.message||e)+'</small></div>';
  }
}

function renderUsers(){
  const q=(document.getElementById("search").value||"").trim().toLowerCase();
  const list=allUsers.filter(u=>{
    const s=[u.id,u.name,u.email,u.phone,u.mobile,u.username].join(" ").toLowerCase();
    return !q||s.includes(q);
  });
  if(!list.length){document.getElementById("users").innerHTML='<div class="loading">No users found.</div>';return}
  document.getElementById("users").innerHTML=list.map(u=>{
    const isMe=u.uid===auth.currentUser?.uid || u.email===ADMIN_EMAIL;
    const b=!!blockedMap[u.uid],d=!!deletedMap[u.uid];
    let status=d?'<span class="badge deleted">Deleted</span>':b?'<span class="badge blocked">Blocked</span>':(u.online===true||u.online==="true"?'<span class="badge online">Online</span>':'<span class="badge offline">Offline</span>');
    return `<div class="user">
      <div class="person"><img class="avatar" src="${esc(photo(u))}" onerror="this.src='https://via.placeholder.com/100?text=User'">
        <div><div class="name">${esc(u.name||"User")}${isMe?" 👑":""}</div><div class="sub">${esc(u.email||u.phone||u.id)}</div><div class="sub">ID: ${esc(u.id)}</div></div>
      </div>
      <div>${status}</div>
      <div class="actions">
        <button class="open" onclick="viewUser('${esc(u.id)}')">Open</button>
        ${!isMe?(b?`<button class="unblock" onclick="setBlocked('${esc(u.id)}',false)">Unblock</button>`:`<button class="block" onclick="setBlocked('${esc(u.id)}',true)">Block</button>`):""}
        ${!isMe&&!d?`<button class="delete" onclick="deleteUser('${esc(u.id)}')">Delete</button>`:""}
        ${d&&!isMe?`<button class="unblock" onclick="restoreUser('${esc(u.id)}')">Restore</button>`:""}
      </div>
    </div>`;
  }).join("");
}

async function viewUser(uid){
  const u=allUsers.find(x=>x.id===uid);if(!u)return;
  alert("User Details\\n\\nName: "+(u.name||"")+
    "\\nEmail: "+(u.email||"")+
    "\\nPhone: "+(u.phone||u.mobile||"")+
    "\\nUser ID: "+uid+
    "\\nOnline: "+(u.online?"Yes":"No"));
}

async function setBlocked(userId,state){
  const u=allUsers.find(x=>x.id===userId); if(!u)return;
  if(u.uid===auth.currentUser?.uid || String(u.email||'').toLowerCase()===ADMIN_EMAIL.toLowerCase())return;
  const authUid=u.uid;
  if(!authUid)return toast("Is account ka Firebase UID nahi mila");
  try{
    if(state) await db.ref("blockedAuth/"+authUid).set(true);
    else await db.ref("blockedAuth/"+authUid).remove();
    toast(state?"Account blocked — user access stopped ✓":"Account unblocked ✓");
    await loadAll();
  }catch(e){toast("Block/Unblock failed: "+(e.message||"Rules check karo"))}
}

async function deleteUser(userId){
  const u=allUsers.find(x=>x.id===userId); if(!u)return;
  if(u.uid===auth.currentUser?.uid || String(u.email||'').toLowerCase()===ADMIN_EMAIL.toLowerCase())return;
  if(!confirm("Is account ko disable/delete karna hai? User app me access nahi kar payega jab tak admin restore nahi karta. Continue?"))return;
  if(!u.uid)return toast("Is account ka Firebase UID nahi mila");
  try{
    await db.ref("deletedAuth/"+u.uid).set(true);
    await db.ref("blockedAuth/"+u.uid).set(true);
    await db.ref("users/"+userId+"/status").set("deleted");
    await db.ref("users/"+userId+"/online").set(false);
    toast("Account disabled/deleted ✓");
    await loadAll();
  }catch(e){toast("Delete failed: "+(e.message||"Rules check karo"))}
}

async function restoreUser(userId){
  const u=allUsers.find(x=>x.id===userId); if(!u||!u.uid)return;
  try{
    await db.ref("deletedAuth/"+u.uid).remove();
    await db.ref("blockedAuth/"+u.uid).remove();
    await db.ref("users/"+userId+"/status").set("active");
    toast("Account restored ✓");
    await loadAll();
  }catch(e){toast("Restore failed: "+(e.message||"Rules check karo"))}
}

function logout(){auth.signOut()}
</script>
</body>
</html>

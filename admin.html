<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hamro Message Admin</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f3f6f8;color:#17202a}.top{background:#073b4c;color:white;padding:16px;font-weight:800;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:white;border-radius:15px;padding:18px;margin-bottom:15px;box-shadow:0 5px 20px #0001}.login{max-width:400px;margin:70px auto;text-align:center}button{padding:10px 14px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.google{width:100%;background:white;border:1px solid #ccc}.logout{background:white}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f8fafc;padding:15px;border-radius:12px}.stat b{display:block;font-size:25px;margin-top:5px}input{padding:12px;border:1px solid #ccc;border-radius:9px;width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.table{overflow:auto}.danger{background:#b42318;color:#fff}.ok{background:#067647;color:#fff}.pill{padding:5px 8px;border-radius:20px;font-weight:bold}.active{background:#e0f2fe}.blocked{background:#fee4e2;color:#b42318}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header class="top"><span>🛡️ Hamro Message Admin</span><span><small id="email"></small> <button id="logout" class="logout hidden">Logout</button></span></header>
<main class="wrap"><section id="login" class="card login"><div style="font-size:50px">🔐</div><h2>Admin Login</h2><p>Only authorized administrator can access.</p><button id="google" class="google">Continue with Google</button><p id="msg" style="color:#b42318"></p></section>
<section id="panel" class="hidden"><div class="card"><h2>Dashboard</h2><div class="stats"><div class="stat">Users<b id="total">0</b></div><div class="stat">Online<b id="online">0</b></div><div class="stat">Blocked<b id="blocked">0</b></div><div class="stat">Disabled<b id="deleted">0</b></div></div></div>
<div class="card"><input id="search" placeholder="Search name, email, phone..."></div><div class="card"><h3>All Users</h3><div class="table"><table><thead><tr><th>User</th><th>Email</th><th>Phone</th><th>Status</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div></div></section></main>
<script>
const ADMIN="joshibasu12345@gmail.com",C={apiKey:"AIzaSyD-ZwsV9vfkRvJQVGnezrIUsB0nZZxSGo",authDomain:"hamro-message-4622c.firebaseapp.com",databaseURL:"https://hamro-message-4622c-default-rtdb.firebaseio.com",projectId:"hamro-message-4622c",storageBucket:"hamro-message-4622c.firebasestorage.app",messagingSenderId:"614672953381",appId:"1:614672953381:web:bc057d676bbbc07d64cfcc",measurementId:"G-GGB5PK89MY"};
firebase.initializeApp(C);const auth=firebase.auth(),db=firebase.database();let users=[];
const $=x=>document.getElementById(x),esc=x=>{let d=document.createElement("div");d.textContent=x??"";return d.innerHTML};
$("google").onclick=async()=>{try{let p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});let r=await auth.signInWithPopup(p);if(r.user.email.toLowerCase()!==ADMIN){await auth.signOut();$("msg").textContent="Access denied. Only "+ADMIN+" allowed."}}catch(e){$("msg").textContent=e.message||"Login failed"}};
$("logout").onclick=()=>auth.signOut();$("search").oninput=render;
async function status(id){let [a,b,c]=await Promise.all([db.ref("publicAccountStatus/"+id).once("value"),db.ref("blockedAuth/"+id).once("value"),db.ref("deletedAuth/"+id).once("value")]);return c.val()===true||a.val()==="deleted"?"deleted":b.val()===true||a.val()==="blocked"?"blocked":"active"}
async function load(){let s=await db.ref("users").once("value");users=[];s.forEach(x=>users.push({id:x.key,...(x.val()||{})}));await Promise.all(users.map(async u=>u.status=await status(u.id)));render()}
function render(){let q=$("search").value.toLowerCase();let a=users.filter(u=>[u.name,u.email,u.phone,u.username,u.id].some(x=>String(x||"").toLowerCase().includes(q)));$("total").textContent=users.length;$("online").textContent=users.filter(u=>u.online===true&&u.status==="active").length;$("blocked").textContent=users.filter(u=>u.status==="blocked").length;$("deleted").textContent=users.filter(u=>u.status==="deleted").length;$("body").innerHTML=a.map(u=>`<tr><td><b>${esc(u.name||u.id)}</b><br>${esc(u.username||u.id)}</td><td>${esc(u.email||"-")}</td><td>${esc(u.phone||"-")}</td><td><span class="pill ${u.status==="active"?"active":"blocked"}">${u.status}</span></td><td>${u.status==="active"?`<button class="danger" onclick="blockUser('${esc(u.id)}')">Block</button>`:`<button class="ok" onclick="restoreUser('${esc(u.id)}')">Restore</button>`}</td></tr>`).join("")}
window.blockUser=async id=>{let u=users.find(x=>x.id===id);if(!u||!confirm("Block "+(u.name||id)+"?"))return;let n=Date.now(),x={};x["blockedAuth/"+id]=true;x["deletedAuth/"+id]=false;x["publicAccountStatus/"+id]="blocked";x["users/"+id+"/accountStatus"]="blocked";x["users/"+id+"/blockedAt"]=n;x["adminActions/"+id]={status:"blocked",by:ADMIN,at:n};await db.ref().update(x);await load()};
window.restoreUser=async id=>{let u=users.find(x=>x.id===id);if(!u||!confirm("Restore "+(u.name||id)+"?"))return;let n=Date.now(),x={};x["blockedAuth/"+id]=false;x["deletedAuth/"+id]=false;x["publicAccountStatus/"+id]="active";x["users/"+id+"/accountStatus"]="active";x["users/"+id+"/blockedAt"]=null;x["adminActions/"+id]={status:"active",by:ADMIN,at:n};await db.ref().update(x);await load()};
auth.onAuthStateChanged(async u=>{if(!u){$("login").classList.remove("hidden");$("panel").classList.add("hidden");$("logout").classList.add("hidden");return}if((u.email||"").toLowerCase()!==ADMIN){await auth.signOut();$("msg").textContent="Access denied. Only "+ADMIN+" allowed.";return}$("login").classList.add("hidden");$("panel").classList.remove("hidden");$("logout").classList.remove("hidden");$("email").textContent=u.email;await load()});
</script></body></html>

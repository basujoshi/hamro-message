<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hamro Message — Admin</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f3f6f8;color:#17202a}.top{position:sticky;top:0;z-index:5;background:#075e54;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}.top h2{margin:0;font-size:19px;flex:1}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 20px #0000000d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:16px;border-radius:16px;background:#fff}.num{font-size:28px;font-weight:800}.muted{color:#667085;font-size:12px}.green{background:#25d366;color:#fff;border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.red{background:#e53935;color:#fff}.gray{background:#e9eef2;color:#17202a;border:0;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.search{width:100%;padding:12px;border:1px solid #d6dde3;border-radius:12px;font-size:15px}.user{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f2}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#ddd}.info{flex:1;min-width:0}.name{font-weight:800}.email,.small{font-size:12px;color:#667085;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#98a2b3}.online .dot{background:#25d366}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.login{max-width:420px;margin:10vh auto;padding:24px;text-align:center}.hidden{display:none!important}.danger{color:#b42318}.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#eef2f6}.blocked{background:#ffe4e4;color:#b42318}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:12px;display:none;z-index:20}@media(max-width:650px){.stats{grid-template-columns:1fr}.user{align-items:flex-start}.actions{width:100%;justify-content:flex-start}.user{flex-wrap:wrap}.info{min-width:calc(100% - 65px)}}
</style></head><body>
<div id="login" class="card login"><h1>🛡️ Hamro Message Admin</h1><p class="muted">Authorized admin only</p><button id="loginBtn" class="green" onclick="adminLogin()">Continue with Google</button><p id="loginMsg" class="danger"></p></div>
<div id="app" class="hidden"><div class="top"><h2>🛡️ Hamro Message Admin</h2><button class="gray" onclick="logout()">Logout</button></div><main class="wrap"><div class="stats"><div class="stat"><div class="muted">Total Users</div><div id="total" class="num">0</div></div><div class="stat"><div class="muted">Active / Online</div><div id="active" class="num">0</div></div><div class="stat"><div class="muted">Blocked</div><div id="blockedCount" class="num">0</div></div></div><div class="card"><input id="search" class="search" placeholder="Search name, phone or email..." oninput="renderUsers()"></div><div class="card"><h3>Accounts</h3><div id="list">Loading...</div></div></main></div><div id="toast" class="toast"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyD-ZwsV9vfkRvJQVGnezrIUsB0nZZXrSGo",authDomain:"hamro-message-4622.firebaseapp.com",databaseURL:"https://hamro-message-4622-default-rtdb.firebaseio.com",projectId:"hamro-message-4622",storageBucket:"hamro-message-4622.firebasestorage.app",messagingSenderId:"614672953381",appId:"1:614672953381:web:bc057d676bbbc07d64cfcc",measurementId:"G-GGB5PK89MY"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();const ADMIN_EMAIL='joshibasu12345@gmail.com';let users={};
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.__t);window.__t=setTimeout(()=>x.style.display='none',2400)}
async function adminLogin(){document.getElementById('loginMsg').textContent='';try{const p=new firebase.auth.GoogleAuthProvider();const r=await auth.signInWithPopup(p);if((r.user.email||'').toLowerCase()!==ADMIN_EMAIL){await auth.signOut();throw new Error('Only '+ADMIN_EMAIL+' can open admin panel.')}show()}catch(e){document.getElementById('loginMsg').textContent=e.message||'Admin login failed'}}
auth.onAuthStateChanged(u=>{if(u&&(u.email||'').toLowerCase()===ADMIN_EMAIL)show();else hide()});
function show(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');watch()}
function hide(){document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden')}
async function logout(){await auth.signOut();hide()}
function watch(){db.ref('users').on('value',s=>{users={};s.forEach(c=>users[c.key]={id:c.key,...(c.val()||{})});renderUsers()})}
function renderUsers(){const q=(document.getElementById('search').value||'').toLowerCase();const a=Object.values(users).filter(u=>[u.name,u.phone,u.email,u.id].join(' ').toLowerCase().includes(q));document.getElementById('total').textContent=Object.keys(users).length;document.getElementById('active').textContent=Object.values(users).filter(u=>u.online===true&&!u.blocked&&!u.adminBlocked).length;document.getElementById('blockedCount').textContent=Object.values(users).filter(u=>u.blocked===true||u.adminBlocked===true).length;const box=document.getElementById('list');if(!a.length){box.innerHTML='<div class="muted">No users found.</div>';return}box.innerHTML='';a.forEach(u=>{const row=document.createElement('div');row.className='user '+(u.online?'online':'');row.innerHTML='<img class="avatar" src="'+(u.photo||'')+'"><div class="info"><div class="name">'+esc(u.name||'User')+' <span class="badge">'+(u.online?'🟢 Online':'⚫ Offline')+'</span> '+((u.blocked||u.adminBlocked)?'<span class="badge blocked">BLOCKED</span>':'')+'</div><div class="email">'+esc(u.email||'No email')+'</div><div class="small">📱 '+esc(u.phone||u.id)+' · Last seen: '+(u.lastSeen?new Date(u.lastSeen).toLocaleString():'—')+'</div></div><div class="actions"><button class="gray" onclick="toggleBlock(\''+escAttr(u.id)+'\')">'+((u.blocked||u.adminBlocked)?'Unblock':'Block')+'</button><button class="gray red" onclick="deleteAccount(\''+escAttr(u.id)+'\')">Delete</button></div>';box.appendChild(row)})}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function escAttr(x){return String(x).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
async function toggleBlock(id){const u=users[id];if(!u)return;const next=!(u.blocked===true||u.adminBlocked===true);if(!confirm((next?'Block ':'Unblock ')+(u.name||id)+'?'))return;try{await db.ref('users/'+id).update({adminBlocked:next,blocked:next,deviceActive:!next,online:false}); if(u.uid) await db.ref('userStatus/'+u.uid).update({phone:id,blocked:next,updatedAt:firebase.database.ServerValue.TIMESTAMP});toast(next?'Account blocked ✓':'Account unblocked ✓')}catch(e){toast('Failed: '+e.message)}}
async function deleteAccount(id){const u=users[id];if(!u)return;if(!confirm('Delete app account '+(u.name||id)+'? This removes the account data from Realtime Database. Firebase Auth credential is not deleted by this client-only page. Continue?'))return;try{const up={};['users','friends','friendRequests','blocks','notifications','stories','typing','calls','callIce','groupMembers'].forEach(p=>up[p+'/'+id]=null); if(u.uid) up['userStatus/'+u.uid]=null;await db.ref().update(up);toast('Account data deleted ✓')}catch(e){toast('Delete failed: '+e.message)}}
</script></body></html>

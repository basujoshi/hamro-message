<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamro Message</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f9;color:#17202a}
button,input,textarea{font:inherit}button{cursor:pointer;border:0}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd;padding:10px 14px;display:flex;gap:10px;align-items:center}.brand{font-weight:800;font-size:21px;color:#1976d2}.top input{flex:1;max-width:430px;padding:10px 13px;border:1px solid #ddd;border-radius:22px}.wrap{max-width:1000px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;border:1px solid #e2e5e9;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 4px #0000000b}.cover{height:260px;background:#dfe5ec center/cover no-repeat;position:relative}.avatar{width:128px;height:128px;border-radius:50%;object-fit:cover;border:5px solid #fff;position:absolute;left:24px;bottom:-64px;background:#ddd}.profilebody{padding:72px 22px 18px}.profilebody h1{margin:0 0 4px}.muted{color:#667085}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{padding:10px 15px;border-radius:9px;background:#e9eef5}.btn.primary{background:#1976d2;color:#fff}.btn.danger{background:#d92d20;color:#fff}.feed{padding:14px}.post{padding:14px;border-bottom:1px solid #eee}.post:last-child{border-bottom:0}.posthead{display:flex;gap:10px;align-items:center}.mini{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#ddd}.postmedia{width:100%;max-height:600px;object-fit:contain;background:#111;border-radius:10px;margin-top:10px}.posttext{white-space:pre-wrap;margin:10px 0}.menu{position:fixed;right:16px;bottom:18px;z-index:30}.fab{width:58px;height:58px;border-radius:50%;font-size:28px;background:#1976d2;color:#fff;box-shadow:0 5px 18px #0003}.sheet{position:fixed;right:16px;bottom:86px;z-index:31;background:#fff;border:1px solid #ddd;border-radius:14px;padding:8px;display:none;box-shadow:0 8px 30px #0003}.sheet.show{display:grid}.sheet button{padding:12px 16px;text-align:left;background:#fff;border-radius:9px}.sheet button:hover{background:#f2f5f8}.storyrow{display:flex;gap:12px;overflow:auto;padding:12px}.story{min-width:82px;text-align:center}.story img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #1976d2}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{background:#fff;padding:28px;border-radius:18px;width:min(420px,100%);box-shadow:0 8px 30px #0001}.progress{height:8px;background:#e6e8eb;border-radius:10px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;width:0;background:#1976d2}.modal{position:fixed;inset:0;background:#0008;z-index:50;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modalbox{background:#fff;border-radius:16px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:18px}.modalbox video{width:100%;max-height:60vh;background:#000}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hide{display:none!important}.call{position:fixed;inset:0;background:#111;color:#fff;z-index:100;display:none;flex-direction:column}.call.open{display:flex}.remote{flex:1;display:grid;place-items:center}.remote video{width:100%;height:100%;object-fit:contain;background:#111}.local{position:absolute;right:12px;top:70px;width:120px;height:170px;background:#333;border-radius:10px;object-fit:cover}.callbar{padding:16px;display:flex;justify-content:center;gap:10px}.callbar button{border-radius:50%;width:50px;height:50px}.err{color:#b42318;margin-top:8px;white-space:pre-wrap}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:9px;z-index:200;display:none}
@media(max-width:600px){.cover{height:190px}.avatar{width:100px;height:100px;bottom:-50px;left:15px}.profilebody{padding-top:60px}.top input{display:none}.wrap{padding:8px}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="loginbox">
    <h1>Hamro Message</h1><p class="muted">Login to continue</p>
    <button id="googleBtn" class="btn primary" style="width:100%">Continue with Google</button>
    <div id="loginErr" class="err"></div>
  </div>
</div>

<div id="app" class="hide">
<header class="top">
  <div class="brand">Hamro Message</div>
  <input id="search" placeholder="Search users...">
  <button id="logout" class="btn">Logout</button>
</header>
<main class="wrap">
  <section class="card">
    <div id="cover" class="cover"><img id="avatar" class="avatar" src=""></div>
    <div class="profilebody">
      <h1 id="name">User</h1><div id="email" class="muted"></div>
      <div id="bio" class="muted"></div>
      <div class="actions">
        <button id="editProfile" class="btn">Edit profile</button>
        <button id="coverBtn" class="btn">Change cover</button>
        <button id="avatarBtn" class="btn">Change photo</button>
        <button id="aboutBtn" class="btn">About</button>
        <button id="adminBtn" class="btn hide">Admin</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div style="padding:12px 14px;font-weight:700">Stories</div>
    <div id="stories" class="storyrow"></div>
  </section>

  <section class="card">
    <div class="feed" id="feed"></div>
  </section>
</main>

<div class="menu">
  <div id="sheet" class="sheet">
    <button data-type="postText">📝 Text post</button>
    <button data-type="postPhoto">📷 Photo post</button>
    <button data-type="postVideo">🎥 Video post</button>
    <button data-type="storyPhoto">📖 Photo story</button>
    <button data-type="storyVideo">🎬 Video story</button>
    <button data-type="cameraPhoto">📸 Camera photo</button>
    <button data-type="cameraVideo">🎦 Camera video</button>
  </div>
  <button id="fab" class="fab">+</button>
</div>
</div>

<div id="modal" class="modal"><div class="modalbox">
  <div class="row" style="justify-content:space-between"><h2 id="modalTitle">Upload</h2><button id="closeModal" class="btn">✕</button></div>
  <textarea id="caption" rows="4" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:9px" placeholder="Write something..."></textarea>
  <input id="fileInput" type="file" accept="image/*,video/*" class="hide">
  <video id="preview" controls class="hide"></video>
  <div id="uploadStatus" class="muted"></div><div class="progress"><i id="bar"></i></div>
  <div class="actions"><button id="choose" class="btn">Choose file</button><button id="camera" class="btn">Camera</button><button id="publish" class="btn primary">Publish</button></div>
  <div id="modalErr" class="err"></div>
</div></div>

<div id="editModal" class="modal"><div class="modalbox">
  <h2>Edit profile</h2><input id="editName" style="width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px" placeholder="Name">
  <textarea id="editBio" rows="4" style="width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px" placeholder="Bio"></textarea>
  <div class="actions"><button id="saveProfile" class="btn primary">Save</button><button id="closeEdit" class="btn">Cancel</button></div>
</div></div>

<div id="call" class="call">
  <div class="remote"><video id="remoteVideo" autoplay playsinline></video></div>
  <video id="localVideo" class="local" autoplay muted playsinline></video>
  <div class="callbar"><button id="mute">🎙️</button><button id="cam">📹</button><button id="hang">📵</button></div>
</div>
<div id="toast" class="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import {getDatabase,ref,set,update,push,onValue,get,remove,onDisconnect} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";
import {getStorage,ref as sref,uploadBytesResumable,getDownloadURL} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-storage.js";

const firebaseConfig={
 apiKey:"AIzaSyD-ZwsV9vfkRvJQVGnezrIUsB0nZZXrSGo",
 authDomain:"hamro-message-4622c.firebaseapp.com",
 databaseURL:"https://hamro-message-4622c-default-rtdb.firebaseio.com",
 projectId:"hamro-message-4622c",
 storageBucket:"hamro-message-4622c.firebasestorage.app",
 messagingSenderId:"614672953381",
 appId:"1:614672953381:web:bc057d676bbbc07d64cfcc",
 measurementId:"G-GGB5PK89MY"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),storage=getStorage(app);
const provider=new GoogleAuthProvider();
const $=id=>document.getElementById(id); let user=null,selectedType="",selectedFile=null,localStream=null,pc=null,currentCallId=null;
const ADMIN_EMAIL="joshibasu12345@gmail.com";

function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2500)}
function esc(s=""){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function showModal(type){selectedType=type;selectedFile=null;$("caption").value="";$("fileInput").value="";$("preview").classList.add("hide");$("bar").style.width="0";$("uploadStatus").textContent="";$("modalErr").textContent="";$("modalTitle").textContent=type.startsWith("story")?"Create story":"Create post";$("modal").classList.add("open")}
async function saveUser(u){
 const r=ref(db,"users/"+u.uid),snap=await get(r),old=snap.exists()?snap.val():{};
 await update(r,{uid:u.uid,name:old.name||u.displayName||"User",email:u.email||"",photoURL:old.photoURL||u.photoURL||"",coverURL:old.coverURL||"",bio:old.bio||"",lastSeen:Date.now(),online:true});
}
async function upload(file,path,onProgress){
 return await new Promise((resolve,reject)=>{
  const task=uploadBytesResumable(sref(storage,path),file);
  task.on("state_changed",s=>{const p=Math.round(s.bytesTransferred/s.totalBytes*100);$("bar").style.width=p+"%";$("uploadStatus").textContent="Uploading "+p+"%";},reject,async()=>resolve(await getDownloadURL(task.snapshot.ref)));
 });
}
async function publish(){
 try{
  $("modalErr").textContent="";
  const cap=$("caption").value.trim();
  if(selectedType==="postText"){await push(ref(db,"posts"),{uid:user.uid,name:user.displayName||"User",photoURL:user.photoURL||"",caption:cap,type:"text",createdAt:Date.now()});$("modal").classList.remove("open");return}
  if(!selectedFile){$("modalErr").textContent="Please choose or capture a file.";return}
  const folder=selectedType.startsWith("story")?"stories":"posts";
  const url=await upload(selectedFile,folder+"/"+user.uid+"/"+Date.now()+"_"+selectedFile.name.replace(/[^\w.-]/g,"_"));
  const type=selectedFile.type.startsWith("video/")?"video":"image";
  const data={uid:user.uid,name:user.displayName||"User",photoURL:user.photoURL||"",caption:cap,url,type,createdAt:Date.now()};
  await push(ref(db,folder),data);$("modal").classList.remove("open");toast("Uploaded successfully");
 }catch(e){$("modalErr").textContent=e.message||String(e)}
}
async function uploadProfile(kind,file){
 if(!file)return;try{
  const url=await upload(file,"users/"+user.uid+"/"+kind+"_"+Date.now()+"_"+file.name.replace(/[^\w.-]/g,"_"));
  const obj={};obj[kind==="photo"?"photoURL":"coverURL"]=url;await update(ref(db,"users/"+user.uid),obj);
  toast("Photo updated");
 }catch(e){toast(e.message)}
}
function renderUser(d){
 $("name").textContent=d.name||"User";$("email").textContent=d.email||"";$("bio").textContent=d.bio||"";
 $("avatar").src=d.photoURL||user.photoURL||"";
 $("cover").style.backgroundImage=d.coverURL?`url("${d.coverURL}")`:"";
 $("adminBtn").classList.toggle("hide",user.email!==ADMIN_EMAIL);
}
function loadUser(){onValue(ref(db,"users/"+user.uid),s=>{if(s.exists())renderUser(s.val())})}
function loadPosts(){onValue(ref(db,"posts"),s=>{const v=s.val()||{};const arr=Object.entries(v).map(([id,x])=>({...x,id})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));$("feed").innerHTML=arr.map(p=>`<article class="post"><div class="posthead"><img class="mini" src="${esc(p.photoURL||"")}" onerror="this.style.display='none'"><b>${esc(p.name||"User")}</b></div><div class="posttext">${esc(p.caption||"")}</div>${p.url?(p.type==="video"?`<video class="postmedia" src="${esc(p.url)}" controls playsinline></video>`:`<img class="postmedia" src="${esc(p.url)}">`):""}<div class="muted" style="margin-top:8px">${new Date(p.createdAt||Date.now()).toLocaleString()} ${p.uid===user.uid?`<button class="btn danger delpost" data-id="${p.id}">Delete</button>`:""}</div></article>`).join("")||"<div class='muted'>No posts yet.</div>";document.querySelectorAll(".delpost").forEach(b=>b.onclick=()=>remove(ref(db,"posts/"+b.dataset.id)))})}
function loadStories(){onValue(ref(db,"stories"),s=>{const v=s.val()||{},now=Date.now(),arr=Object.values(v).filter(x=>now-(x.createdAt||0)<86400000);$("stories").innerHTML=arr.map(x=>`<div class="story"><img src="${esc(x.photoURL||"")}" title="${esc(x.name||"User")}"><div>${esc(x.name||"User")}</div></div>`).join("")||"<span class='muted'>No active stories.</span>"})}
async function editProfile(){const s=await get(ref(db,"users/"+user.uid)),d=s.val()||{};$("editName").value=d.name||user.displayName||"";$("editBio").value=d.bio||"";$("editModal").classList.add("open")}
async function startCamera(video=false){
 try{
  const stream=await navigator.mediaDevices.getUserMedia(video?{video:true,audio:true}:{video:true});
  const rec=new MediaRecorder(stream),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{selectedFile=new File(chunks,video?"camera.webm":"camera.jpg",{type:video?"video/webm":"image/jpeg"});$("preview").src=URL.createObjectURL(selectedFile);$("preview").classList.remove("hide")};rec.start();setTimeout(()=>rec.stop(),video?5000:1000);toast(video?"Recording 5 seconds...":"Capturing photo...");stream.getTracks().forEach(t=>setTimeout(()=>t.stop(),video?5100:1100));
 }catch(e){$("modalErr").textContent=e.message}
}
async function beginCall(peerId,videoCall){
 currentCallId=push(ref(db,"calls")).key;localStream=await navigator.mediaDevices.getUserMedia(videoCall?{video:true,audio:true}:{video:false,audio:true});
 $("localVideo").srcObject=localStream;$("call").classList.add("open");
 pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=e=>$("remoteVideo").srcObject=e.streams[0];
 pc.onicecandidate=e=>e.candidate&&push(ref(db,"calls/"+currentCallId+"/offerCandidates"),e.candidate.toJSON());
 const offer=await pc.createOffer();await pc.setLocalDescription(offer);
 await set(ref(db,"calls/"+currentCallId),{caller:user.uid,callee:peerId,video:videoCall,offer:{type:offer.type,sdp:offer.sdp},createdAt:Date.now()});
}
async function hangup(){if(currentCallId)await update(ref(db,"calls/"+currentCallId),{ended:true});if(pc){pc.close();pc=null}if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}$("call").classList.remove("open");currentCallId=null}
onAuthStateChanged(auth,async u=>{
 if(!u){$("login").classList.remove("hide");$("app").classList.add("hide");return}
 user=u;await saveUser(u);$("login").classList.add("hide");$("app").classList.remove("hide");loadUser();loadPosts();loadStories();
 if(u.email===ADMIN_EMAIL)$("adminBtn").onclick=()=>location.href="admin.html";
 update(ref(db,"users/"+u.uid),{online:true});onDisconnect(ref(db,"users/"+u.uid+"/online")).set(false);
});
$("googleBtn").onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){$("loginErr").textContent=e.message}};
$("logout").onclick=()=>signOut(auth);$("fab").onclick=()=>$("sheet").classList.toggle("show");
document.querySelectorAll("#sheet button").forEach(b=>b.onclick=()=>{showModal(b.dataset.type);$("sheet").classList.remove("show")});
$("closeModal").onclick=()=>$("modal").classList.remove("open");$("choose").onclick=()=>$("fileInput").click();
$("fileInput").onchange=e=>{selectedFile=e.target.files[0];if(selectedFile){$("preview").src=URL.createObjectURL(selectedFile);$("preview").classList.toggle("hide",!selectedFile.type.startsWith("video/")&&!selectedFile.type.startsWith("image/"))}};
$("camera").onclick=()=>startCamera(selectedType.toLowerCase().includes("video"));
$("publish").onclick=publish;$("avatarBtn").onclick=()=>{const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=e=>uploadProfile("photo",e.target.files[0]);i.click()};
$("coverBtn").onclick=()=>{const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=e=>uploadProfile("cover",e.target.files[0]);i.click()};
$("editProfile").onclick=editProfile;$("closeEdit").onclick=()=>$("editModal").classList.remove("open");
$("saveProfile").onclick=async()=>{await update(ref(db,"users/"+user.uid),{name:$("editName").value.trim()||"User",bio:$("editBio").value.trim()});$("editModal").classList.remove("open")};
$("aboutBtn").onclick=()=>toast("Profile information is shown here.");
$("hang").onclick=hangup;$("mute").onclick=()=>{if(localStream){const t=localStream.getAudioTracks()[0];if(t)t.enabled=!t.enabled;$("mute").textContent=t&&t.enabled?"🎙️":"🔇"}};
$("cam").onclick=()=>{if(localStream){const t=localStream.getVideoTracks()[0];if(t)t.enabled=!t.enabled;$("cam").textContent=t&&t.enabled?"📹":"🚫"}};
</script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamro Message Admin</title>
<style>
body{margin:0;background:#f4f6f9;font-family:system-ui;color:#17202a}.top{background:#111827;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:14px}.stat{font-size:28px;font-weight:800}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.btn{padding:9px 12px;border:0;border-radius:8px;cursor:pointer}.danger{background:#d92d20;color:#fff}.ok{background:#1976d2;color:#fff}.muted{color:#667085}.err{color:#b42318}.login{min-height:100vh;display:grid;place-items:center}.loginbox{background:#fff;padding:28px;border-radius:15px;width:min(400px,90%)}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.table{font-size:13px}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h1>Admin Panel</h1><p>Authorized admin only.</p><button id="google" class="btn ok">Continue with Google</button><div id="err" class="err"></div></div></div>
<div id="app" style="display:none"><header class="top"><b>Hamro Message Admin</b><button id="logout" class="btn">Logout</button></header>
<main class="wrap"><div class="grid"><div class="card"><div class="muted">Users</div><div id="usersN" class="stat">0</div></div><div class="card"><div class="muted">Posts</div><div id="postsN" class="stat">0</div></div><div class="card"><div class="muted">Stories</div><div id="storiesN" class="stat">0</div></div><div class="card"><div class="muted">Online</div><div id="onlineN" class="stat">0</div></div></div>
<div class="card"><h2>Users</h2><input id="search" placeholder="Search" style="padding:10px;width:100%;max-width:420px"><div style="overflow:auto"><table class="table"><thead><tr><th>User</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead><tbody id="users"></tbody></table></div></div>
<div class="card"><h2>Posts</h2><div id="posts"></div></div><div class="card"><h2>Stories</h2><div id="stories"></div></div>
</main></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import {getDatabase,ref,onValue,remove,update} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";
const cfg={apiKey:"AIzaSyD-ZwsV9vfkRvJQVGnezrIUsB0nZZXrSGo",authDomain:"hamro-message-4622c.firebaseapp.com",databaseURL:"https://hamro-message-4622c-default-rtdb.firebaseio.com",projectId:"hamro-message-4622c",storageBucket:"hamro-message-4622c.firebasestorage.app",messagingSenderId:"614672953381",appId:"1:614672953381:web:bc057d676bbbc07d64cfcc",measurementId:"G-GGB5PK89MY"};
const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app),provider=new GoogleAuthProvider(),ADMIN="joshibasu12345@gmail.com";const $=x=>document.getElementById(x);let allUsers={};
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
onAuthStateChanged(auth,u=>{if(!u){$("login").style.display="grid";$("app").style.display="none";return}if(u.email!==ADMIN){$("err").textContent="This Google account is not authorized as admin.";signOut(auth);return}$("login").style.display="none";$("app").style.display="block";watch()});
$("google").onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){$("err").textContent=e.message}};
$("logout").onclick=()=>signOut(auth);
function watch(){
 onValue(ref(db,"users"),s=>{allUsers=s.val()||{};renderUsers();let a=Object.values(allUsers);$("usersN").textContent=a.length;$("onlineN").textContent=a.filter(x=>x.online).length});
 onValue(ref(db,"posts"),s=>{const v=s.val()||{};$("postsN").textContent=Object.keys(v).length;$("posts").innerHTML=Object.entries(v).map(([id,x])=>`<div style="padding:10px;border-bottom:1px solid #eee"><b>${esc(x.name)}</b><div>${esc(x.caption)}</div>${x.url?`<a href="${esc(x.url)}" target="_blank">Open media</a>`:""} <button class="btn danger dp" data-id="${id}">Delete</button></div>`).join("")||"<span class='muted'>No posts</span>";document.querySelectorAll(".dp").forEach(b=>b.onclick=()=>remove(ref(db,"posts/"+b.dataset.id)))});
 onValue(ref(db,"stories"),s=>{const v=s.val()||{};$("storiesN").textContent=Object.keys(v).length;$("stories").innerHTML=Object.entries(v).map(([id,x])=>`<div style="padding:10px;border-bottom:1px solid #eee"><b>${esc(x.name)}</b> — ${new Date(x.createdAt||0).toLocaleString()} <button class="btn danger ds" data-id="${id}">Delete</button></div>`).join("")||"<span class='muted'>No stories</span>";document.querySelectorAll(".ds").forEach(b=>b.onclick=()=>remove(ref(db,"stories/"+b.dataset.id)))});
}
function renderUsers(){const q=$("search").value.toLowerCase();$("users").innerHTML=Object.entries(allUsers).filter(([id,x])=>(x.name||"").toLowerCase().includes(q)||(x.email||"").toLowerCase().includes(q)).map(([id,x])=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${x.online?"🟢 Online":"⚪ Offline"}</td><td><button class="btn danger block" data-id="${id}">${x.blocked?"Unblock":"Block"}</button> <button class="btn danger del" data-id="${id}">Delete</button></td></tr>`).join("");document.querySelectorAll(".block").forEach(b=>b.onclick=()=>update(ref(db,"users/"+b.dataset.id),{blocked:!allUsers[b.dataset.id].blocked}));document.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{if(confirm("Delete this user record?"))await remove(ref(db,"users/"+b.dataset.id))})}
$("search").oninput=renderUsers;
</script></body></html>
